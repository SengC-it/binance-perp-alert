name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 边界自检 + 测试
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # M1.4.2.1B immutability checks bind historical artifacts to Git
          # result commits, so the CI clone must retain those commit trees.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 这一步是项目边界的硬约束：一旦代码库出现下单 / 改仓 / 划转端点、
      # 执行类标识符或非 GET 请求，audit 返回非零，CI 直接失败。
      - name: 边界自检（纯提醒 / 零执行）
        run: python main.py audit

      - name: 测试
        run: pytest -q
